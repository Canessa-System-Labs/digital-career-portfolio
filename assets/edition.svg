<text x="64" y="92" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="3">YOUR OWN EDITION</text><text x="64" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1.2">Same engine. Your story.</text><text x="64" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">A new edition is new content, not new code. Editions are tailored by Canessa System Labs.</text><g class="s0"><rect x="64" y="222" width="236" height="86" rx="16" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><text x="84" y="254" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="2">01</text><text x="84" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">Your story</text><text x="84" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">trajectory and offers</text></g><path d="M306 265 h16" stroke="#71717a" stroke-width="1.6" stroke-linecap="round"/><g class="s1"><rect x="328" y="222" width="236" height="86" rx="16" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><text x="348" y="254" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="2">02</text><text x="348" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">Your look</text><text x="348" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">photo and brand colours</text></g><path d="M570 265 h16" stroke="#71717a" stroke-width="1.6" stroke-linecap="round"/><g class="s2"><rect x="592" y="222" width="236" height="86" rx="16" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><text x="612" y="254" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="2">03</text><text x="612" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">Your work</text><text x="612" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">projects with honest status</text></g><path d="M834 265 h16" stroke="#71717a" stroke-width="1.6" stroke-linecap="round"/><g class="s3"><rect x="856" y="222" width="236" height="86" rx="16" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><text x="876" y="254" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="2">04</text><text x="876" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">Live</text><text x="876" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">one link, every device</text></g><g class="cta"><rect x="64" y