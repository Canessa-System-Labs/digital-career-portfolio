<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Publish flow: edit, build, private preview, predeploy guard, live. A failed guard refuses the deploy.">
<title>Publish flow: edit, build, private preview, predeploy guard, live. A failed guard refuses the deploy.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1f24"/><stop offset="1" stop-color="#121316"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".85" cy="0" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".16"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="419" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<text x="64" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f5f5f7" text-anchor="start">From edit to live</text><text x="64" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a1a1aa" text-anchor="start">Every change gets a private preview first. A guard protects the private editions.</text><rect x="64" y="160" width="170" height="92" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.13)" stroke-width="1.6"/><text x="149.0" y="202.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">Edit</text><text x="149.0" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="middle">content/products.json</text><rect x="274" y="160" width="170" height="92" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.13)" stroke-width="1.6"/><text x="359.0" y="202.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">Build</text><text x="359.0" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="middle">build.py writes site/</text><rect x="484" y="160" width="170" height="92" rx="16" fill="rgba(255,255,255,0.045)" stroke="#818cf8" stroke-width="1.6"/><text x="569.0" y="202.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">Preview</text><text x="569.0" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="middle">private link, 7 days</text><rect x="694" y="160" width="170" height="92" rx="16" fill="rgba(255,255,255,0.045)" stroke="#f59e0b" stroke-width="1.6"/><text x="779.0" y="202.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">Guard</text><text x="779.0" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="middle">predeploy check</text><rect x="940" y="160" width="196" height="92" rx="16" fill="rgba(45,212,191,0.08)" stroke="#2dd4bf" stroke-width="1.6"/><text x="1038.0" y="202.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">Live</text><text x="1038.0" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="middle">canessasyslabs.com</text><path d="M240 206.0 L266 206.0" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M450 206.0 L476 206.0" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M660 206.0 L686 206.0" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M870 206.0 L932 206.0" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><text x="902.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f59e0b" text-anchor="middle">passes</text><rect x="694" y="318" width="170" height="70" rx="16" fill="rgba(248,113,113,0.07)" stroke="#f87171" stroke-width="1.6"/><text x="779.0" y="349.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f5f7" text-anchor="middle">Refused</text><text x="779.0" y="371.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="middle">a check failed</text><path d="M779 258 L779 310" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="569" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">You decide when to publish.</text>
</svg>
