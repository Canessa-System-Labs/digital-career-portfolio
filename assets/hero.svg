<title>Digital Career Portfolio. Your career, presented as a product: one link for who you are, what you&#x27;ve built and where each piece of work really stands.</title>
<style>.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .2s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}.fill{opacity:0;animation:in .6s 1.6s ease-out forwards}.pt{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s 1.9s cubic-bezier(.3,1.6,.6,1) forwards}@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}.up{opacity:0;animation:up .8s ease-out forwards}.u1{animation-delay:.5s}.u2{animation-delay:.8s}.u3{animation-delay:1.1s}.u4{animation-delay:1.4s}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes in{to{opacity:1}}.orbit{transform-origin:960px 220px;animation:spin 28s linear infinite}.orbit2{transform-origin:960px 220px;animation:spin 46s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}.shine{animation:shine 6s ease-in-out infinite}@keyframes shine{0%,100%{opacity:.35}50%{opacity:.9}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
