<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Comparison of a CV, a gallery site and a digital career portfolio across six capabilities.">
<title>Comparison of a CV, a gallery site and a digital career portfolio across six capabilities.</title>
<defs>
