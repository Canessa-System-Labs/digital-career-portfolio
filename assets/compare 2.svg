<rect width="1200" height="600" rx="28" fill="url(#bg)"/>
<rect width="1200" height="600" rx="28" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="599" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<text x="64" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f5f5f7" text-anchor="start">Why a digital career portfolio</text><text x="64" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a1a1aa" text-anchor="start">What each format can actually show about your work.</text><rect x="922" y="130" width="236" height="392" rx="20" fill="#2dd4bf" fill-opacity=".07" stroke="#2dd4bf" stroke-opacity=".5"/><text x="690" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#a1a1aa" text-anchor="middle">CV or résumé</text><text x="840" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#a1a1aa" text-anchor="middle">Gallery site</text><text x="1040" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f5f7" text-anchor="middle">Digital career</text><text x="1040" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f5f7" text-anchor="middle">portfolio</text><text x="64" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f5f5f7" text-anchor="start">Shows judgment, not just job titles</text><circle cx="690" cy="230" r="10" fill="none" stroke="#71717a" stroke-width="2"/><circle cx="840" cy="230" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M840 220 A10 10 0 0 1 840 240 Z" fill="#f59e0b"/><circle cx="1040" cy="230" r="11" fill="#2dd4bf"/><path d="M1035 230 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="64" x2="1136" y1="255" y2="255" stroke="rgba(255,255,255,0.13)"/><text x="64" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f5f5f7" text-anchor="start">An honest status for every project</text><circle cx="690" cy="280" r="10" fill="none" stroke="#71717a" stroke-width="2"/><circle cx="840" cy="280" r="10" fill="none" stroke="#71717a" stroke-width="2"/><circle cx="1040" cy="280" r="11" fill="#2dd4bf"/><path d="M1035 280 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="64" x2="1136" y1="305" y2="305" stroke="rgba(255,255,255,0.13)"/><text x="64" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f5f5f7" text-anchor="start">Writing that reads like a book</text><circle cx="690" cy="330" r="10" fill="none" stroke="#71717a" stroke-width="2"/><circle cx="840" cy="330" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M840 320 A10 10 0 0 1 840 340 Z" fill="#f59e0b"/><circle cx="1040" cy="330" r="11" fill="#2dd4bf"/><path d="M1035 330 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="64" x2="1136" y1="355" y2="355" stroke="rgba(255,255,255,0.13)"/><text x="64" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f5f5f7" text-anchor="start">Story pages with sound and film</text><circle cx="690" cy="380" r="10" fill="none" stroke="#71717a" stroke-width="2"/><circle cx="840" cy="380" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M840 370 A10 10 0 0 1 840 390 Z" fill="#f59e0b"/><circle cx="1040" cy="380" r="11" fill="#2dd4bf"/><path d="M1035 380 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="64" x2="1136" y1="405" y2="405" stroke="rgba(255,255,255,0.13)"/><text x="64" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f5f5f7" text-anchor="start">Private editions behind a passkey</text><circle cx="690" cy="430" r="10" fill="none" stroke="#71717a" stroke-width="2"/><circle cx="840" cy="430" r="10" fill="none" stroke="#71717a" stroke-width="2"/><circle cx="1040" cy="430" r="11" fill="#2dd4bf"/><path d="M1035 430 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="64" x2="1136" y1="455" y2="455" stroke="rgba(255,255,255,0.13)"/><text x="64" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f5f5f7" text-anchor="start">One link that works on every device</text><circle cx="690" cy="480" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M690 470 A10 10 0 0 1 690 490 Z" fill="#f59e0b"/><circle cx="840" cy="480" r="11" fill="#2dd4bf"/><path d="M835 480 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1040" cy="480" r="11" fill="#2dd4bf"/><path d="M1035 480 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="556" r="11" fill="#2dd4bf"/><path d="M69 556 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="561" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start">Built in</text><circle cx="204.0" cy="556" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M204.0 546 A10 10 0 0 1 204.0 566 Z" fill="#f59e0b"/><text x="224.0" y="561"