<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Animated status ladder: Design, Build, Test and Release fill in order; Release only after Test.">
<title>Animated status ladder: Design, Build, Test and Release fill in order; Release only after Test.</title>
<style>.f0{transform-origin:124px 0;transform:scaleX(0);animation:f0 9s infinite}@keyframes f0{0%,0.0%{transform:scaleX(0)}12.2%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}.c0{opacity:0;animation:c0 9s infinite}@keyframes c0{0%,12.2%{opacity:0}15.6%,88%{opacity:1}100%{opacity:0}}.f1{transform-origin:376px 0;transform:scaleX(0);animation:f1 9s infinite}@keyframes f1{0%,15.6%{transform:scaleX(0)}27.8%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}.c1{opacity:0;animation:c1 9s infinite}@keyframes c1{0%,27.8%{opacity:0}31.1%,88%{opacity:1}100%{opacity:0}}.f2{transform-origin:628px 0;transform:scaleX(0);animation:f2 9s infinite}@keyframes f2{0%,31.1%{transform:scaleX(0)}43.3%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}.c2{opacity:0;animation:c2 9s infinite}@keyframes c2{0%,43.3%{opacity:0}46.7%,88%{opacity:1}100%{opacity:0}}.f3{transform-origin:880px 0;transform:scaleX(0);animation:f3 9s infinite}@keyframes f3{0%,46.7%{transform:scaleX(0)}58.9%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}.c3{opacity:0;animation:c3 9s infinite}@keyframes c3{0%,58.9%{opacity:0}62.2%,88%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2125"/><stop offset="1" stop-color="#18191c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  
</defs>
<rect width="1200" height="300" rx="28" fill="url(#bg)"/>
<rect width="1200" height="300" rx="28" fill="url(#glow)"/>
<rect width="1200" height="300" rx="28" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="1199" height="299" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<text x="64" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5">An honest status ladder</text><text x="64" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">Each step fills only when the one before it is proven. The build refuses a claim that runs ahead.</text><rect x="124" y="170" width="232" height="12" rx="6" fill="rgba(255,255,255,.12)"/><rect class="f0" x="124" y="170" width="232" height="12" rx="6" fill="#34d399"/><text x="124" y="222" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="start" letter-spacing="2">DESIGN</text><g class="c0"><circle cx="338" cy="216" r="11" fill="#34d399"/><path d="M332 216 l4 4 l8 -9" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="376" y="170" width="232" height="12" rx="6" fill="rgba(255,255,255,.12)"/><rect class="f1" x="376" y="170" width="232" height="12" rx="6" fill="#34d399"/><text x="376" y="222" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="start" letter-spacing="2">BUILD</text><g class="c1"><circle cx="590" cy="216" r="11" fill="#34d399"/><path d="M584 216 l4 4 l8 -9" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="628" y="170" width="232" height="12" rx="6" fill="rgba(255,255,255,.12)"/><rect class="f2" x="628" y="170" width="232" height="12" rx="6" fill="#34d399"/><text x="628" y="222" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="start" letter-spacing="2">TEST</text><g class="c2"><circle cx="842" cy="216" r="11" fill="#34d399"/><path d="M836 216 l4 4 l8 -9" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="880" y="170" width="232" height="12" rx="6" fill="rgba(255,255,255,.12)"/><rect class="f3" x="880" y="170" width="232" height="12" rx="6" fill="#2dd4bf"/><text x="880" y="222" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="start" letter-spacing="2">RELEASE</text><g class="c3"><circle cx="1094" cy="216" r="11" fill="#2dd4bf"/><path d="M1088 216 l4 4 l8 -9" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7d8ba1" text-anchor="start" letter-spacing="0">Release is reached only after Test is complete.</text>
</svg>
